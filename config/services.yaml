# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  app.version.default: '1.0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    'App\Serializer\ApiContextBuilder':
      decorates: 'api_platform.serializer.context_builder'
      arguments: [ '@App\Serializer\ApiContextBuilder.inner' ]
      autoconfigure: false

    App\OpenApi\OpenApiDecorator:
      decorates: 'api_platform.openapi.factory'
      arguments: [ '@App\OpenApi\OpenApiDecorator.inner' ]
      autoconfigure: false

  # ── JSON-LD float serialization ────────────────────────────────────────
  # Replace API Platform's JSON-LD encoder so float properties keep their
  # zero fraction (e.g. ReleaseStats::percentage → 200.0, not 200).
  # ApiJsonEncode = API Platform's default options + JSON_PRESERVE_ZERO_FRACTION.
    App\Serializer\ApiJsonEncode:
      autoconfigure: false # don't tag it as an encoder of the main serializer

    app.serializer.jsonld_base_encoder:
      class: Symfony\Component\Serializer\Encoder\JsonEncoder
      autoconfigure: false
      arguments:
        $encodingImpl: '@App\Serializer\ApiJsonEncode'

    api_platform.jsonld.encoder:
      class: ApiPlatform\Serializer\JsonEncoder
      arguments:
        $format: 'jsonld'
        $jsonEncoder: '@app.serializer.jsonld_base_encoder'

  # ── Collection totalItems as int ───────────────────────────────────────
  # Paginator::getTotalItems() returns a float; with JSON_PRESERVE_ZERO_FRACTION
  # a count of 4 would serialize as 4.0. Cast it back to int without touching
  # genuine float properties.
    App\Serializer\CollectionTotalItemsIntNormalizer:
      decorates: 'api_platform.hydra.normalizer.collection'
      arguments:
        $decorated: '@App\Serializer\CollectionTotalItemsIntNormalizer.inner'
      autoconfigure: false
