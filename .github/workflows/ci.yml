name: CI

on:
  pull_request:
  workflow_dispatch:

# Cancel a stale run for the same ref (branch/PR) when a newer push arrives —
# avoids burning CI minutes on commits that are already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout is the only thing in this job that talks to GitHub, and it
# only needs to read the repo — no PR comments, releases, or package pushes.
permissions:
  contents: read

jobs:
  qa-and-tests:
    name: QA & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The app container's entrypoint (docker/frankenphp/docker-entrypoint.sh)
      # waits for a reachable DATABASE_URL and runs migrations before the
      # server is considered up — that's what `make up`'s --wait is waiting
      # on. compose.yml only bundles a Postgres service for `make test`
      # (testgator-db-test), not a separate "dev" one, so point the app
      # container at that for CI, purely so `make up` (APP_ENV=dev) can boot.
      # This is unrelated to `make test`'s correctness: that target sources
      # .env.test's values as real shell env vars inside each exec'd process
      # (see the Makefile's LOAD_TEST_ENV), which is what actually makes it
      # ignore this file and any other .env.local — Symfony's own Dotenv
      # does NOT override already-set real env vars, so relying on
      # APP_ENV=test alone would not have been enough.
      - name: Point the app container at the test database
        run: echo 'DATABASE_URL="postgresql://test:test@testgator-db-test:5432/testgator_test?serverVersion=16&charset=utf8"' > .env.local

      - name: Start the test database
        run: docker compose -f compose.yml up -d --wait testgator-db-test

      # docker compose's own `build` can't use the GHA cache backend (that
      # needs the docker-container buildx driver), so the dev image is built
      # directly with buildx here instead of `make build`. It's loaded into
      # the local Docker daemon under the same tag compose.yml expects
      # (`testgator-server`), so every later `docker compose`/`make` step
      # below finds it already built and never triggers its own rebuild.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dev image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: frankenphp_dev
          tags: testgator-server:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # composer install runs at container-start time, not as a Docker image
      # layer (vendor/ is bind-mounted, deliberately empty in the image — see
      # compose.yml) — so Docker layer caching above doesn't speed this up.
      # Caching Composer's own download cache and mounting it into the
      # container is what actually skips re-downloading packages here.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: .cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      # On a cache miss, .cache/composer doesn't exist yet — if Docker is the
      # one to create it (as the bind-mount source), it does so as root,
      # which then makes actions/cache's post-job save step fail to read it
      # back as the runner user. Creating it here first keeps it owned by
      # the runner throughout.
      - name: Ensure Composer cache directory exists
        run: mkdir -p ${{ github.workspace }}/.cache/composer

      # ./vendor is bind-mounted (empty on a fresh checkout — vendor/ isn't
      # committed), so without this, the entrypoint itself would run a cold
      # `composer install` in the critical path of `make up`'s healthcheck
      # wait, on top of the DB-wait and migrations that already run there.
      # Pre-populating it here (bypasses the entrypoint's frankenphp-specific
      # logic entirely, since the overridden command isn't 'frankenphp') keeps
      # that window well inside the healthcheck's start_period.
      - name: Pre-install composer dependencies
        run: |
          docker compose -f compose.yml run --rm \
            -v ${{ github.workspace }}/.cache/composer:/tmp/composer-cache \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
            testgator-server composer install --prefer-dist --no-progress --no-interaction

      - name: Start the app container
        run: make up

      - name: Dump app container logs
        if: failure()
        run: docker compose -f compose.yml logs testgator-server

      - name: Run QA (rector, php-cs-fixer, phpstan, deptrac)
        run: make qa

      # `make test` brings up (and, via its EXIT trap, tears down) both
      # testgator-db-test and testgator-s3-test (SeaweedFS, used as the S3
      # backend for file-storage tests) itself — nothing extra needed here.
      - name: Run tests
        run: make test

      - name: Tear down
        if: always()
        run: make down
